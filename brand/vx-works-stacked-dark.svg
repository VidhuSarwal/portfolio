<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Square frame with corner brackets -->
  <rect x="32" y="32" width="448" height="448" fill="none" stroke="#0A0A0A" stroke-width="6" stroke-opacity="0.30"/>
  <!-- Corner brackets TL -->
  <polyline points="32,88 32,32 88,32" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="square"/>
  <!-- Corner brackets TR -->
  <polyline points="424,32 480,32 480,88" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="square"/>
  <!-- Corner brackets BL -->
  <polyline points="32,424 32,480 88,480" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="square"/>
  <!-- Corner brackets BR -->
  <polyline points="424,480 480,480 480,424" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="square"/>
  <!-- Callout box around text -->
  <rect x="108" y="162" width="296" height="190" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-opacity="0.55"/>
  <!-- VX — large -->
  <text
    x="256"
    y="281"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="148"
    fill="#0A0A0A"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="-2"
  >VX</text>
  <!-- WORKS — small, tracked out -->
  <text
    x="256"
    y="328"
    font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
    font-weight="500"
    font-size="28"
    fill="#0A0A0A"
    text-anchor="middle"
    dominant-baseline="auto"
    letter-spacing="12"
  >WORKS</text>
</svg>
